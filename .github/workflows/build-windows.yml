name: Build Files for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.102'

      - name: 设置 Visual Studio 开发者环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 下载 NuGet 客户端
        run: Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"

      - name: 恢复 NuGet 包
        run: .\nuget.exe restore Files.slnx -Verbosity detailed

      - name: 编译解决方案 (Release x64)
        run: |
          msbuild Files.slnx `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:BuildProjectReferences=true `
            /p:PublishReadyToRun=false `
            /p:DisableFastUpToDateCheck=true `
            /nologo /v:normal

      - name: 发布主应用 (Portable, 跳过测试项目)
        run: dotnet publish src/Files.App/Files.App.csproj `
          --configuration Release `
          -r win-x64 `
          --self-contained true `
          /p:PublishReadyToRun=false `
          /p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish/win-x64

      - name: 打包 Portable zip
        run: Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "Files_Portable.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Files-Portable
          path: |
            Files_Portable.zip
          retention-days: 7
