name: Build Files for Windows

# 触发条件：推送代码到 main 分支，或在 GitHub 网页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 使用 GitHub 官方 Windows 虚拟机（预装 Visual Studio 2022 + Windows SDK）
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 安装 .NET 10 SDK
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.102'

      # 3. 恢复整个解决方案的 NuGet 包
      - name: 恢复 NuGet 包
        run: dotnet restore Files.slnx

      # 4. 使用 MSBuild 编译（支持 C# + C++ 项目）
      - name: 编译解决方案 (Release x64)
        run: |
          msbuild Files.slnx ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:BuildProjectReferences=true ^
            /nologo ^
            /v:normal

      # 5. 发布为 Portable 版本
      - name: 发布 Portable 版本
        run: |
          dotnet publish src/Files.App/Files.App.csproj ^
            -c Release ^
            -p:Platform=x64 ^
            -r win-x64 ^
            --self-contained true ^
            -p:PublishSingleFile=false ^
            -o ./publish/win-x64

      # 6. 压缩输出目录为 zip
      - name: 打包 Portable zip
        run: Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "Files_Portable.zip"

      # 7. 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Files-Portable
          path: |
            Files_Portable.zip
          retention-days: 7
